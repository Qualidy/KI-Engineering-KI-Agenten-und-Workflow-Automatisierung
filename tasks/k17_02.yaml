title: Einen eigenen Ablauf aufnehmen
difficulty: 2
question: |
  Wähle einen Ablauf aus deinem Arbeitsalltag, der **mindestens wöchentlich** vorkommt und
  über zwei Personen oder zwei Systeme läuft (Urlaubsantrag, Bestellanforderung,
  Reisekostenabrechnung, Kundenanfrage, Onboarding einer neuen Kollegin).

  1. Notiere den **Auslöser** in einem Satz.
  2. Schreibe die Schritte in eine Tabelle mit den Spalten
     `Nr. | Schritt | Wer (Rolle) | System | Medienbruch | Wartezeit`.
     Mindestens sechs Zeilen.
  3. Markiere anschließend jede Zeile mit einem Medienbruch und jede Zeile mit einer
     Wartezeit über einem Tag.
  4. Beantworte in zwei Sätzen: An welcher Stelle verliert der Ablauf am meisten Zeit –
     durch Arbeit oder durch Liegen?
tip: |
  Denke an den letzten konkreten Fall, nicht an die Idealvorstellung. Wartezeiten fühlen
  sich beim Aufschreiben unwichtig an, weil dabei niemand arbeitet – genau deshalb werden
  sie fast immer vergessen, obwohl sie meist den größten Teil der Durchlaufzeit ausmachen.
solution: |
  Bewertungskriterien für eine gute Bearbeitung:

  - Der Auslöser ist ein **Ereignis**, kein Zustand („Formular wird eingereicht", nicht
    „Urlaub wird gebraucht").
  - Schritte sind als Tätigkeit mit Verb formuliert, nicht als Substantivblöcke.
  - In der Spalte „Wer" stehen **Rollen** (Sachbearbeitung, Führungskraft), keine Namen –
    sonst wird der Ablauf beim nächsten Personalwechsel ungültig.
  - Mindestens ein Medienbruch ist gefunden. Wer keinen findet, hat zu grob geschnitten:
    Jedes Abtippen, Kopieren, Ausdrucken und Wieder-Einscannen zählt.
  - Die Antwort zu Punkt 4 trennt **Bearbeitungszeit** von **Durchlaufzeit**.

  Beispielhaftes Ergebnis für einen Urlaubsantrag: reine Bearbeitungszeit etwa zehn
  Minuten, Durchlaufzeit vier Tage. Das Zeitproblem liegt also nicht im Ausfüllen, sondern
  im Warten auf die Freigabe. Wer hier „das Formular automatisieren" vorschlägt, hat den
  falschen Schritt gewählt – zu automatisieren ist das **Anfordern und Erinnern**.
