title: Eignungs-Check auf eigene Aufgaben anwenden
difficulty: 2
question: |
  Wähle **drei** Aufgaben aus deinem eigenen Arbeitsalltag: eine, bei der du KI schon nutzt oder
  nutzen würdest, eine, bei der du unsicher bist, und eine, bei der du KI klar ablehnst.

  Wende auf alle drei den Eignungs-Check aus Abschnitt 8.5 an. Beantworte je Aufgabe alle fünf
  Fragen – Daten, Wahrheitsbedarf, Rechnen, Prüfbarkeit, Folgen – und notiere zu jeder
  kritischen Antwort die konkrete Maßnahme.

  Ziehe dann ein Fazit je Aufgabe:

  - **geeignet** ohne Auflagen
  - **geeignet mit Maßnahmen** – welche genau?
  - **nicht geeignet** – an welcher Frage scheitert es?

  Prüfe zum Schluss deine Ablehnungs-Aufgabe noch einmal: Gibt es einen **Teilschritt** darin,
  der doch geeignet wäre?
tip: |
  Die dritte Aufgabe ist die interessante. „Nicht geeignet" gilt fast nie für eine ganze Tätigkeit,
  sondern für einen bestimmten Schritt darin. Zerlege sie: Recherche, Aufbereitung, Formulierung,
  Bewertung, Entscheidung – welcher dieser Teile ist wirklich das Problem?
solution: |
  Beispielhafte Bearbeitung für „Bewerbungen vorsortieren":

  | Frage | Antwort | Maßnahme |
  |---|---|---|
  | Daten | personenbezogen, besonders sensibel | nur in freigegebenem Umfeld, hier: nicht verfügbar |
  | Wahrheitsbedarf | hoch, jede Aussage muss belegbar sein | Material mitgeben, Belege verlangen |
  | Rechnen | nein | – |
  | Prüfbarkeit | eingeschränkt – warum jemand aussortiert wurde, ist schwer nachvollziehbar | – |
  | Folgen | erheblich, Diskriminierungsrisiko und rechtliche Wirkung | – |

  Fazit: **nicht geeignet** als Vorsortierung. Der Teilschritt-Test lohnt sich trotzdem: Das
  Formulieren einer Eingangsbestätigung, das Strukturieren von Interviewfragen oder das
  Zusammenfassen einer Stellenbeschreibung sind unkritisch – die **Bewertung von Personen** ist
  es nicht (Kap. 14).

  Gute Bearbeitungen erkennst du daran, dass die Maßnahmen konkret sind („Summen in Excel prüfen",
  „Namen durch Platzhalter ersetzen") und dass mindestens einmal die Frage nach der Prüfbarkeit
  ehrlich mit Nein beantwortet wurde. Wer bei allen drei Aufgaben zu „geeignet" kommt, hat den
  Check zu wohlwollend angewendet.
